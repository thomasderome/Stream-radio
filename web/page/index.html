<!DOCTYPE html>

<html lang="fr">
    <header>
        <meta charset="UTF-8" />
        <title>Radio</title>

        <link rel="stylesheet" href="style.css" />
    </header>
    <body>
        <div id="container">
            <div id="sidebar">
                <span>Sidebar</span>
            </div>
            <div class="main">
                <div class="header-main">
                    <button style="background: transparent" id="sidebar_button">
                        <img src="assets/sidebar-close-svgrepo-com.svg" alt="sidebar_button" />
                        <script src="scripts/sidebar.js"></script>
                    </button>

                    <input placeholder="Radio: " id="search"/>
                    <label for="search"></label>
                </div>
                <div class="radio-list">
                    <div class="radio">
                        <img class="icon_radio" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ_bTfemPHfHmxcNoaLLO3hbxaaMU1npXHsPw&s" alt="image"></img>
                        <span class="radio_name">TEST</span>
                        <button class="radio_button">
                            <span>Play</span>
                        </button>
                    </div>
                    <div class="radio">
                        <img class="icon_radio" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ_bTfemPHfHmxcNoaLLO3hbxaaMU1npXHsPw&s" alt="image"></img>
                        <span class="radio_name">Skyrock</span>
                        <button class="radio_button">
                            <span>TEST</span>
                        </button>
                    </div>
                    <div class="radio">
                        <img class="icon_radio" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ_bTfemPHfHmxcNoaLLO3hbxaaMU1npXHsPw&s" alt="image"></img>
                        <span class="radio_name">Skyrock</span>
                        <button class="radio_button">
                            <span>TEST</span>
                        </button>
                    </div>

                </div>
                <div class="footer-main">
                    <span>Footer</span>
                </div>
            </div>
        </div>
    </body>
</html>
