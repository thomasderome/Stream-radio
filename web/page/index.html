<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <title>Radio stream</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Strictement nécessaire pour le JS (sidebar.js toggle .close sur #container) */
        #container {
            display: grid;
            grid-template-columns: 280px auto;
            transition: grid-template-columns 300ms ease-in-out;
        }
        #container.close {
            grid-template-columns: 0 auto;
        }
        #sidebar {
            overflow: hidden;
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden bg-neutral-800 text-white font-sans">
<div id="container" class="h-screen">

    <!-- SIDEBAR -->
    <div id="sidebar" class="bg-neutral-900 border-r border-neutral-700 flex flex-col h-full">

        <div class="px-5 py-6 border-b border-neutral-700">
                <span class="text-xl font-bold tracking-wide flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-neutral-300" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 18v-6a9 9 0 0 1 18 0v6" />
                        <path d="M21 19a2 2 0 0 1-2 2h-1a2 2 0 0 1-2-2v-3a2 2 0 0 1 2-2h3zM3 19a2 2 0 0 0 2 2h1a2 2 0 0 0 2-2v-3a2 2 0 0 0-2-2H3z" />
                    </svg>
                    Radio stream
                </span>
        </div>

        <!-- Favoris -->
        <div class="px-4 pt-5">
            <h2 class="text-xs uppercase tracking-widest text-neutral-400 font-semibold mb-3 px-1">Favoris</h2>
            <div id="favorites-list" class="flex flex-col gap-2 mb-6">

                <div class="radio flex items-center gap-3 bg-neutral-800 hover:bg-neutral-700 transition-colors rounded-xl p-2 cursor-pointer">
                    <img class="icon_radio w-10 h-10 rounded-lg object-cover" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ_bTfemPHfHmxcNoaLLO3hbxaaMU1npXHsPw&s" alt="image" />
                    <span class="radio_name flex-1 text-sm font-medium truncate">NRJ Hits</span>
                    <button class="radio_button w-9 h-9 rounded-full bg-indigo-500 hover:bg-indigo-400 transition-colors flex items-center justify-center flex-shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-white block mx-auto" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8 5v14l11-7z" />
                        </svg>
                    </button>
                </div>

            </div>
        </div>

        <!-- Historique -->
        <div class="px-4">
            <h2 class="text-xs uppercase tracking-widest text-neutral-400 font-semibold mb-3 px-1">Historique</h2>
            <div id="history-list" class="flex flex-col gap-2">

                <div class="radio flex items-center gap-3 bg-neutral-800 hover:bg-neutral-700 transition-colors rounded-xl p-2 cursor-pointer">
                    <img class="icon_radio w-10 h-10 rounded-lg object-cover" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ_bTfemPHfHmxcNoaLLO3hbxaaMU1npXHsPw&s" alt="image" />
                    <span class="radio_name flex-1 text-sm font-medium truncate">Skyrock</span>
                    <button class="radio_button w-9 h-9 rounded-full bg-indigo-500 hover:bg-indigo-400 transition-colors flex items-center justify-center flex-shrink-0">
                        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-white block mx-auto" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8 5v14l11-7z" />
                        </svg>
                    </button>
                </div>

            </div>
        </div>

    </div>

    <!-- MAIN -->
    <div class="main flex flex-col h-full min-h-0 bg-neutral-800">

        <!-- HEADER -->
        <div class="header-main flex items-center gap-4 px-6 py-4 border-b border-neutral-700 bg-neutral-800/80 backdrop-blur">
            <button id="sidebar_button" style="background: transparent" class="p-2 rounded-lg hover:bg-neutral-700 transition-colors flex-shrink-0">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-neutral-200" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="4" width="18" height="16" rx="2" />
                    <line x1="9" y1="4" x2="9" y2="20" />
                    <polyline points="14 9 11 12 14 15" />
                </svg>
            </button>

            <div class="flex-1 flex items-center gap-3">
                <input
                        placeholder="Radio: "
                        id="search"
                        class="flex-1 bg-neutral-700 text-white placeholder-neutral-400 rounded-lg px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-indigo-500 transition"
                />
                <label for="search"></label>

                <!-- Sélecteur de tags -->
                <select id="tag-filter" class="bg-neutral-700 text-white text-sm rounded-lg px-3 py-2 outline-none focus:ring-2 focus:ring-indigo-500 transition cursor-pointer">
                    <option value="">Tous les tags</option>
                    <option value="rap">Rap</option>
                    <option value="rock">Rock</option>
                    <option value="pop">Pop</option>
                    <option value="electro">Electro</option>
                </select>
            </div>
        </div>

        <!-- RADIO LIST -->
        <div class="radio-list flex-1 overflow-y-auto p-5 grid gap-4" style="grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); align-content: start;">

            <div class="radio bg-neutral-700 hover:bg-neutral-600 transition-colors rounded-2xl p-4 flex items-center gap-4 shadow-lg">
                <img class="icon_radio w-16 h-16 rounded-xl object-cover flex-shrink-0" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ_bTfemPHfHmxcNoaLLO3hbxaaMU1npXHsPw&s" alt="image" />
                <div class="flex-1 min-w-0">
                    <span class="radio_name block font-semibold truncate">TEST</span>
                    <div class="flex gap-1 mt-1 flex-wrap tags">
                        <span class="tag text-[10px] uppercase tracking-wide bg-indigo-500/20 text-indigo-300 px-2 py-0.5 rounded-full">Rap</span>
                        <span class="tag text-[10px] uppercase tracking-wide bg-pink-500/20 text-pink-300 px-2 py-0.5 rounded-full">Rock</span>
                    </div>
                </div>
                <button class="radio_button bg-indigo-500 hover:bg-indigo-400 transition-colors text-sm font-medium px-4 py-2 rounded-full flex-shrink-0 flex items-center justify-center">
                    <span>Play</span>
                </button>
            </div>

            <div class="radio bg-neutral-700 hover:bg-neutral-600 transition-colors rounded-2xl p-4 flex items-center gap-4 shadow-lg">
                <img class="icon_radio w-16 h-16 rounded-xl object-cover flex-shrink-0" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ_bTfemPHfHmxcNoaLLO3hbxaaMU1npXHsPw&s" alt="image" />
                <div class="flex-1 min-w-0">
                    <span class="radio_name block font-semibold truncate">TEST</span>
                    <div class="flex gap-1 mt-1 flex-wrap tags">
                        <span class="tag text-[10px] uppercase tracking-wide bg-emerald-500/20 text-emerald-300 px-2 py-0.5 rounded-full">Pop</span>
                    </div>
                </div>
                <button class="radio_button bg-indigo-500 hover:bg-indigo-400 transition-colors text-sm font-medium px-4 py-2 rounded-full flex-shrink-0 flex items-center justify-center">
                    <span>TEST</span>
                </button>
            </div>

            <!-- Exemple radio en cours de lecture -> bouton en état "pause" -->
            <div class="radio bg-neutral-700 hover:bg-neutral-600 transition-colors rounded-2xl p-4 flex items-center gap-4 shadow-lg">
                <img class="icon_radio w-16 h-16 rounded-xl object-cover flex-shrink-0" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ_bTfemPHfHmxcNoaLLO3hbxaaMU1npXHsPw&s" alt="image" />
                <div class="flex-1 min-w-0">
                    <span class="radio_name block font-semibold truncate">TEST</span>
                    <div class="flex gap-1 mt-1 flex-wrap tags">
                        <span class="tag text-[10px] uppercase tracking-wide bg-yellow-500/20 text-yellow-300 px-2 py-0.5 rounded-full">Electro</span>
                    </div>
                </div>
                <button class="radio_button w-11 h-11 rounded-full bg-indigo-500 hover:bg-indigo-400 transition-colors flex items-center justify-center flex-shrink-0">
                    <!-- Icône pause : à basculer via JS (play <-> pause) -->
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white block mx-auto" viewBox="0 0 24 24" fill="currentColor">
                        <rect x="6" y="5" width="4" height="14" rx="1" />
                        <rect x="14" y="5" width="4" height="14" rx="1" />
                    </svg>
                </button>
            </div>

        </div>

        <!-- FOOTER (player) -->
        <div class="footer-main flex items-center gap-5 px-6 py-4 border-t border-neutral-700 bg-neutral-900">

            <!-- Radio en cours -->
            <div class="flex items-center gap-3 min-w-[220px]">
                <img id="img_radio_read" class="icon_radio w-12 h-12 rounded-xl object-cover" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ_bTfemPHfHmxcNoaLLO3hbxaaMU1npXHsPw&s" alt="current radio" />
                <div class="flex flex-col">
                    <span id="name_radio_read" class="radio_name text-lg font-semibold">Aucune lecture</span>
                </div>
            </div>

            <!-- Bouton play/pause centré -->
            <div class="flex-1 flex items-center justify-center">
                <button id="button_play" class="w-12 h-12 rounded-full bg-indigo-500 hover:bg-indigo-400 transition-colors flex items-center justify-center flex-shrink-0">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-white block mx-auto" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 5v14l11-7z" />
                    </svg>
                </button>
            </div>

            <!-- Volume -->
            <div class="flex items-center gap-2 min-w-[220px] justify-end">
                <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 text-neutral-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5" />
                    <path d="M15.54 8.46a5 5 0 0 1 0 7.07" />
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14" />
                </svg>
                <input id="volume" type="range" min="0" max="100" value="70" class="w-36 accent-indigo-500 cursor-pointer" />
            </div>

        </div>
    </div>
</div>
<script src="scripts/player_controller.js"></script>
<script src="scripts/sidebar.js"></script>
</body>
</html>
