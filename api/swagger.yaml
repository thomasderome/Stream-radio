openapi: 3.0.3
info:
  title: Stream Radio API
  version: 1.0.0
  description: API documentation for the Stream Radio application.
servers:
  - url: http://localhost:3000
    description: Local server
paths:
  /player/set_play_state:
    put:
      summary: Set player state (play/pause)
      tags:
        - Player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetPlayStateRequest'
      responses:
        '200':
          description: Successfully updated play state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetPlayStateRequest'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /player/set_volume:
    put:
      summary: Set player volume
      tags:
        - Player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetVolumeRequest'
      responses:
        '200':
          description: Successfully updated volume
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SetVolumeRequest'
        '400':
          description: Bad request (Volume must be between 0 and 1)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /player/set_play_station_id:
    put:
      summary: Set the current station to play by ID
      tags:
        - Player
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetStationsRequest'
      responses:
        '200':
          description: Successfully set station and started playing
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayersData'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /player/get_play_data:
    get:
      summary: Get current player state and station data
      tags:
        - Player
      responses:
        '200':
          description: Current player data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlayersData'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /stations/favorite:
    get:
      summary: Get favorite stations
      tags:
        - Stations
      responses:
        '200':
          description: List of favorite stations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Station'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Add a station to favorites
      tags:
        - Stations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FavoriteRequest'
      responses:
        '200':
          description: Station added to favorites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteResponse'
        '404':
          description: Station not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /stations/favorite/{id}:
    delete:
      summary: Remove a station from favorites
      tags:
        - Stations
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID of the station
      responses:
        '200':
          description: Station removed from favorites
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteResponse'
        '400':
          description: Invalid station id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /stations/station:
    get:
      summary: Get stations with optional filters
      tags:
        - Stations
      parameters:
        - in: query
          name: offset
          schema:
            type: integer
          description: Pagination offset
        - in: query
          name: search
          schema:
            type: string
          description: Search term for station name
        - in: query
          name: tags
          schema:
            type: string
          description: Comma-separated list of tag names to filter by
      responses:
        '200':
          description: List of matching stations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Station'
        '400':
          description: Bad request (Invalid parameters)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    SetPlayStateRequest:
      type: object
      properties:
        play_state:
          type: boolean
          description: True to resume, false to pause

    SetVolumeRequest:
      type: object
      properties:
        volume:
          type: number
          format: double
          description: The volume level

    SetStationsRequest:
      type: object
      properties:
        station_id:
          type: string
          description: ID of the station to play

    PlayersData:
      type: object
      properties:
        is_playing:
          type: boolean
        volume:
          type: number
          format: double
        station_id:
          type: integer
        station_name:
          type: string
        station_img:
          type: string
        is_favorite:
          type: boolean

    Station:
      type: object
      properties:
        station_id:
          type: integer
        name:
          type: string
        favicon:
          type: string
        tags:
          type: array
          items:
            type: string
        is_favorite:
          type: boolean
        volume:
          type: number
          format: double
          description: Volume saved for this favorite (absent if none)

    FavoriteRequest:
      type: object
      properties:
        station_id:
          type: integer

    FavoriteResponse:
      type: object
      properties:
        station_id:
          type: integer
        is_favorite:
          type: boolean

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
